# main 브랜치 push(= PR 병합) → Docker Hub 자동 빌드·푸시.
# 레포 시크릿 필요: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN (Docker Hub access token).
#
# 배포 대상이 Apple Silicon Mac mini 라서 linux/arm64 단일 플랫폼으로 빌드한다.
# QEMU 에뮬레이션 대신 arm64 러너에서 네이티브로 돈다 (public 레포라 무료).
name: docker
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
  workflow_dispatch:

jobs:
  build-push:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # /health 에 노출되는 커밋. Dockerfile 의 ARG GIT_SHA 로 들어간다.
          build-args: GIT_SHA=${{ github.sha }}
          tags: |
            amazon7737/lms-chatbot:latest
            amazon7737/lms-chatbot:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha
